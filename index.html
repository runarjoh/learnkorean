<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordkort">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1820" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}button{-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<title>Koreanske ordkort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one column app. Header with voice switch, a lesson menu, then either the flashcard grid or the step-by-step lesson 8 page. */
:root{
  --bg:#f6f4f8; --card:#ffffff; --fg:#2a2433; --muted:#6e6579;
  --accent:#b8325a; --accent-fg:#ffffff; --line:#e3dde9; --well:#eef3f7;
  --vowel:#2f6fb0; --vowel-soft:#e4eef9; --final-soft:#f9e3ea;
  --ok:#2f8a4a; --ok-soft:#e2f3e7; --bad:#c0392b; --bad-soft:#fbe4e1;
  --hangul:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1820; --card:#26222d; --fg:#f1edf5; --muted:#a59cb0;
  --accent:#e2668b; --accent-fg:#1b1820; --line:#3a3442; --well:#dfe7ee;
  --vowel:#8ab8ea; --vowel-soft:#25324a; --final-soft:#4a2433;
  --ok:#6fcf8a; --ok-soft:#1f3a29; --bad:#f08070; --bad-soft:#4a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1820; --card:#26222d; --fg:#f1edf5; --muted:#a59cb0;
  --accent:#e2668b; --accent-fg:#1b1820; --line:#3a3442; --well:#dfe7ee;
  --vowel:#8ab8ea; --vowel-soft:#25324a; --final-soft:#4a2433;
  --ok:#6fcf8a; --ok-soft:#1f3a29; --bad:#f08070; --bad-soft:#4a2420; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
[hidden]{display:none!important}
.ko{font-family:var(--hangul)}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-size:1.1rem;margin:0}
.note{color:var(--muted);margin:4px 0 0;font-size:.95rem;max-width:62ch}
p{margin:0}
.voice{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px;background:transparent;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

button{font:inherit;font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);-webkit-tap-highlight-color:transparent}
button.alt,button.ghost{background:transparent;color:var(--accent)}
button.syb{font-family:var(--hangul);font-size:1.2rem;padding:4px 12px;background:transparent;color:var(--fg);border-color:var(--line)}
button.playing{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

/* lesson menu */
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lessons button{display:grid;gap:2px;text-align:left;border-radius:14px;padding:12px 16px;background:var(--card);color:var(--fg);border:2px solid var(--line)}
.lessons button small{font-weight:700;color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.lessons button > span{font-size:1.05rem}
.lessons button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lessons button[aria-pressed="true"] small{color:var(--accent)}

/* flashcards */
.filter{display:flex;flex-wrap:wrap;gap:8px}
.filter button{background:transparent;color:var(--fg);border-color:var(--line);padding:6px 14px}
.filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.view{display:grid;gap:16px}
.sets{display:grid;gap:28px}
.set{display:grid;gap:12px}
.set h3{font-size:1rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.set h3 span{font-weight:400;letter-spacing:0;text-transform:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.pic{background:var(--well);border-radius:12px;display:grid;place-items:center;padding:10px}
.pic svg{width:100%;max-width:190px;height:auto;display:block}
.word{font-family:var(--hangul);font-size:2.4rem;line-height:1.1;margin:4px 0 0;letter-spacing:.04em}
.no{color:var(--muted);margin:0;font-size:1rem}
.reveal{justify-self:start}
.pron{display:grid;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.rom{font-weight:700;font-size:1.05rem;margin:0}
.btns,.syl{display:flex;flex-wrap:wrap;gap:8px}
.tip{margin:0;font-size:.9rem;color:var(--muted)}
.decomp{font-family:var(--hangul);font-size:1.15rem}
.decomp b{color:var(--accent);font-weight:400}

/* lesson 8 */
.lesson{display:grid;gap:30px}
.intro{display:grid;gap:10px}
.eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;max-width:68ch}
.goal strong{font-size:.95rem}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.steps a{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:.92rem;background:var(--card)}
.steps a i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:.8rem}
.steps a.done i{background:var(--ok);color:var(--card)}
.steps a.done i::after{content:""}
.step{display:grid;gap:14px;scroll-margin-top:16px}
.step-h{display:flex;gap:12px;align-items:center}
.step-h .n{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800}
.step > p{max-width:65ch}

.anat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.anat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;justify-items:center;text-align:center}
.block{display:grid;gap:4px;font-family:var(--hangul);font-size:1.9rem;line-height:1}
.block div{display:grid;place-items:center;min-height:54px;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.block .v{background:var(--vowel-soft);border-color:var(--vowel);color:var(--vowel)}
.block .f{background:var(--final-soft);border-color:var(--accent);color:var(--accent)}
.block.vert{grid-template-columns:58px 58px}
.block.vert .f{grid-column:1 / span 2}
.block.horiz{grid-template-columns:120px}
.eq{font-family:var(--hangul);font-size:1.6rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.88rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:2px solid var(--line);background:var(--bg)}
.legend .lv::before{background:var(--vowel-soft);border-color:var(--vowel)}
.legend .lf::before{background:var(--final-soft);border-color:var(--accent)}

.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.pair{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;min-width:0}
.pside{display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.pside .pic{width:100%;padding:6px;box-sizing:border-box}
.pside .pic svg{max-width:110px}
.pside button{font-family:var(--hangul);font-size:1.9rem;font-weight:400;line-height:1.1;padding:4px 16px;background:transparent;color:var(--fg);border-color:var(--line)}
.pside .no{font-size:.9rem}
.plus{display:grid;justify-items:center;gap:2px;color:var(--accent);font-weight:800}
.plus .ko{font-size:1.5rem;display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--final-soft);border:2px solid var(--accent)}
.pair .both{grid-column:1 / -1;justify-self:center;padding:4px 14px;font-size:.9rem}

.finals{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.fin-top{display:flex;gap:12px;align-items:center}
.fin-top .ko{font-size:2.6rem;line-height:1;display:grid;place-items:center;width:62px;height:62px;border-radius:12px;background:var(--final-soft);color:var(--accent);border:2px solid var(--accent)}
.fin-top b{font-size:1.4rem}
.fin p{font-size:.92rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:var(--hangul);font-size:1.15rem;font-weight:400;padding:3px 12px;background:transparent;color:var(--fg);border-color:var(--line)}
.callout{border-left:4px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;display:grid;gap:8px;max-width:68ch}
.callout .ko{font-size:1.2rem}

.drill{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.drow .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-width:0}
.tile{display:grid;gap:0;justify-items:center;padding:6px 0;border-radius:12px;background:var(--bg);color:var(--fg);border:2px solid var(--line)}
.tile .ko{font-size:1.9rem;line-height:1.15;font-weight:400}
.tile small{font-size:.78rem;color:var(--muted);font-weight:700}
.tile.has small{color:var(--accent)}
.drow .playrow{padding:8px 12px;font-size:.88rem;white-space:nowrap}
@media (max-width:480px){.drow{grid-template-columns:1fr}.drow .playrow{justify-self:start}}

.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.qmodes{display:flex;flex-wrap:wrap;gap:8px}
.qmodes button{background:transparent;color:var(--fg);border-color:var(--line);padding:6px 14px}
.qmodes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.qbar .track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qbody{display:grid;gap:14px}
.qplay{justify-self:center;font-size:1.1rem;padding:14px 26px}
.qprompt{text-align:center;color:var(--muted);font-weight:700}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.qopts button{font-size:2rem;font-weight:400;padding:10px;border-radius:14px;background:var(--bg);color:var(--fg);border-color:var(--line)}
.qopts button small{display:block;font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted)}
.qopts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qopts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qopts button:disabled{cursor:default}
.qfeed{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-radius:12px;padding:10px 12px}
.qfeed.ok{background:var(--ok-soft)}
.qfeed.bad{background:var(--bad-soft)}
.qfeed .pic{width:88px;padding:4px;box-sizing:border-box}
.qfeed .pic svg{max-width:80px}
.qfeed b{display:block}
.qfeed .ko{font-size:1.4rem}
.qrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.qdone{text-align:center;display:grid;gap:10px;justify-items:center}
.qdone .big{font-size:2.4rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.fgroups{display:grid;gap:26px}
.fgroup{display:grid;gap:12px}
.fgroup h3{display:flex;gap:10px;align-items:center}
.fgroup h3 .ko{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--final-soft);color:var(--accent);border:2px solid var(--accent);font-size:1.3rem}
.fin-top .letters{display:block;font-family:var(--hangul);font-size:1.05rem;color:var(--muted);letter-spacing:.06em}
.qword{display:grid;justify-items:center;gap:6px}
.qword .pic{width:120px;padding:6px;box-sizing:border-box}
.qword .pic svg{max-width:108px}
.qword .ko{font-size:3rem;line-height:1.1}
.spoken{font-family:var(--hangul);font-size:1.1rem;color:var(--accent)}
.fgroup h3 .ko.wide{width:auto;padding:0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<main>
  <div class="head">
    <h1>Ordkort for koreansk</h1>
    <div class="voice">Stemme
      <div class="seg" role="group" aria-label="Stemme">
        <button id="vf" data-v="f" aria-pressed="true">Kvinne</button>
        <button id="vm" data-v="m" aria-pressed="false">Mann</button>
      </div>
    </div>
  </div>

  <nav class="lessons" aria-label="Velg leksjon">
    <button id="tab-ord" data-view="ord" aria-pressed="true"><small>Ordkort · <span id="ordCount"></span> ord</small><span>Leksjon 7 og tidligere</span></button>
  </nav>

  <p id="aerr" class="note" hidden>Lyden kunne ikke spilles av. Sjekk at volumet er skrudd opp, og at lydbryteren på siden av iPhonen ikke står på lydløs.<span id="aerrWhy"></span></p>

  <section id="view-ord" class="view">
    <p class="note">Se bildet og prøv å si ordet selv. Trykk «Vis uttale» når du vil sjekke.</p>
    <div class="filter" role="group" aria-label="Vis ord fra">
      <button id="fall" data-f="" aria-pressed="true">Alle</button>
    </div>
    <div class="sets" id="sets"></div>
  </section>

  <div id="lessonViews"></div>
</main>

<script>

    lessonViews.append(root);
    setMode(qmode);

    var tab = el('button'); tab.dataset.view = L.id; tab.id = 'tab-' + L.id; tab.setAttribute('aria-pressed', 'false');
    tab.append(el('small', null, 'Leksjon ' + L.num), html('span', null, L.menu));
    menu.append(tab);
  }
  LESSONS.forEach(renderLesson);

  /* ---------- lesson menu ---------- */
  var VIEWS = ['ord'].concat(LESSONS.map(function(L){ return L.id; }));
  function setView(v){
    document.querySelectorAll('.lessons button').forEach(function(t){ t.setAttribute('aria-pressed', String(t.dataset.view === v)); });
    VIEWS.forEach(function(id){ document.getElementById('view-' + id).hidden = id !== v; });
    store('view', v);
  }
  document.querySelectorAll('.lessons button').forEach(function(t){ t.addEventListener('click', function(){ setView(t.dataset.view); window.scrollTo(0, 0); }); });
  var hv = (location.hash || '').replace('#', ''), sv = store('view');
  setView(VIEWS.indexOf(hv) >= 0 ? hv : (VIEWS.indexOf(sv) >= 0 ? sv : 'ord'));

})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
