<body>
<title>Koreanske ordkort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: a responsive grid of word cards. Each card shows the picture, the Korean word and the Norwegian meaning. Pronunciation is hidden until the user reveals it. */
:root{
  --bg:#f6f4f8; --card:#ffffff; --fg:#2a2433; --muted:#6e6579;
  --accent:#b8325a; --accent-fg:#ffffff; --line:#e3dde9; --well:#eef3f7;
  --hangul:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1820; --card:#26222d; --fg:#f1edf5; --muted:#a59cb0;
  --accent:#e2668b; --accent-fg:#1b1820; --line:#3a3442; --well:#dfe7ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1820; --card:#26222d; --fg:#f1edf5; --muted:#a59cb0;
  --accent:#e2668b; --accent-fg:#1b1820; --line:#3a3442; --well:#dfe7ee; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:grid;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-size:1.25rem;margin:0}
.note{color:var(--muted);margin:4px 0 0;font-size:.95rem;max-width:60ch}
.voice{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px;background:transparent;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.pic{background:var(--well);border-radius:12px;display:grid;place-items:center;padding:10px}
.pic svg{width:100%;max-width:190px;height:auto;display:block}
.word{font-family:var(--hangul);font-size:2.4rem;line-height:1.1;margin:4px 0 0;letter-spacing:.04em}
.no{color:var(--muted);margin:0;font-size:1rem}
.reveal{justify-self:start}
.pron{display:grid;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.rom{font-weight:700;font-size:1.05rem;margin:0}
.btns,.syl{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
button.alt,button.ghost{background:transparent;color:var(--accent)}
button.syb{font-family:var(--hangul);font-size:1.2rem;padding:4px 12px;background:transparent;color:var(--fg);border-color:var(--line)}
button.playing{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.filter{display:flex;flex-wrap:wrap;gap:8px}
.filter button{background:transparent;color:var(--fg);border-color:var(--line);padding:6px 14px}
.filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#sets{display:grid;gap:28px}
.set{display:grid;gap:12px}
.set h2{font-size:1rem;margin:0;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.set h2 span{font-weight:400;letter-spacing:0;text-transform:none}
.tip{margin:0;font-size:.9rem;color:var(--muted)}
</style>

<main>
  <div class="head">
    <div>
      <h1>Ordkort for koreansk</h1>
      <p class="note">Se bildet og prøv å si ordet selv. Trykk «Vis uttale» når du vil sjekke.</p>
    </div>
    <div class="voice">Stemme
      <div class="seg" role="group" aria-label="Stemme">
        <button id="vf" data-v="f" aria-pressed="true">Kvinne</button>
        <button id="vm" data-v="m" aria-pressed="false">Mann</button>
      </div>
    </div>
  </div>
  <p id="aerr" class="note" hidden>Lyden kunne ikke spilles av. Sjekk at volumet er skrudd opp, og at lydbryteren på siden av iPhonen ikke står på lydløs.<span id="aerrWhy"></span></p>
  <div class="filter" role="group" aria-label="Vis ord fra">
    <button id="fall" data-f="" aria-pressed="true">Alle</button>
  </div>
  <div id="sets"></div>
</main>

      if(my !== token) return;
      if(c.state === 'suspended' && c.resume) c.resume();
      var src = c.createBufferSource();
      src.buffer = buf; src.connect(c.destination);
      src.onended = function(){ if(current === src){ current = null; clearActive(); } };
      current = src; src.start(0);
    }).catch(function(e){ fail((firstErr ? firstErr + ' / ' : '') + (e && (e.name || e.message) || 'ukjent')); });
  }

  function play(kind, text, b){
    var url = AUDIO[voice][kind][text];
    if(!url) return;
    var my = ++token;
    if(current){ try { current.onended = null; current.stop(); } catch(e) {} current = null; }
    clearActive();
    activeBtn = b; b.classList.add('playing');
    getCtx(); // unlock the backup route inside the tap
    var done = false;
    function backup(e){
      if(done || my !== token) return; done = true;
      viaWebAudio(url, b, my, e && (e.name || e.message || e.type));
    }
    player.onerror = backup;
    try {
      player.src = url;
      player.currentTime = 0;
      var p = player.play();
      if(p && p.catch) p.catch(backup);
    } catch(e) { backup(e); }
  }

  var segBtns = document.querySelectorAll('.seg button');
  function setVoice(v){
    voice = v;
    segBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    try { localStorage.setItem('voice', v); } catch(e) {}
  }
  segBtns.forEach(function(b){ b.addEventListener('click', function(){ setVoice(b.dataset.v); }); });
  setVoice(voice);

  function btn(label, cls, kind, text){
    var b = document.createElement('button');
    b.textContent = label;
    if(cls) b.className = cls;
    b.addEventListener('click', function(){ play(kind, text, b); });
    return b;
  }

  var setsEl = document.getElementById('sets');
  var filterEl = document.querySelector('.filter');
  var grids = {}, setEls = {};
  WORDS.forEach(function(w){
    if(!grids[w.set]){
      var sec = document.createElement('section');
      sec.className = 'set'; sec.dataset.set = w.set;
      var h = document.createElement('h2');
      h.textContent = w.set + ' ';
      var cnt = document.createElement('span');
      h.append(cnt);
      var g = document.createElement('div');
      g.className = 'grid';
      sec.append(h, g);
      setsEl.append(sec);
      grids[w.set] = g; setEls[w.set] = {sec: sec, cnt: cnt, n: 0};
      var fb = document.createElement('button');
      fb.textContent = w.set; fb.dataset.f = w.set; fb.setAttribute('aria-pressed', 'false');
      filterEl.append(fb);
    }
    setEls[w.set].n++;
    setEls[w.set].cnt.textContent = '· ' + setEls[w.set].n + ' ord';
    var grid = grids[w.set];
    var card = document.createElement('section');
    card.className = 'card';

    var pic = document.createElement('div');
    pic.className = 'pic';
    pic.setAttribute('role', 'img');
    pic.setAttribute('aria-label', w.alt);
    pic.innerHTML = w.svg;

    var ko = document.createElement('p');
    ko.className = 'word'; ko.lang = 'ko'; ko.textContent = w.ko;

    var no = document.createElement('p');
    no.className = 'no'; no.textContent = w.no;

    var pron = document.createElement('div');
    pron.className = 'pron'; pron.hidden = true;

    var rom = document.createElement('p');
    rom.className = 'rom'; rom.textContent = w.rom;

    var btns = document.createElement('div');
    btns.className = 'btns';
    btns.append(btn('▶ Spill av', '', 'n', w.ko), btn('Sakte', 'alt', 's', w.ko));

    var syl = document.createElement('div');
    syl.className = 'syl';
    Array.from(w.ko).forEach(function(s){ var b = btn(s, 'syb', 'y', s); b.lang = 'ko'; syl.append(b); });

    var tip = document.createElement('p');
    tip.className = 'tip'; tip.textContent = w.tip;

    pron.append(rom, btns, syl, tip);

    var reveal = document.createElement('button');
    reveal.className = 'ghost reveal';
    reveal.textContent = 'Vis uttale';
    reveal.setAttribute('aria-expanded', 'false');
    reveal.addEventListener('click', function(){
      var open = pron.hidden;
      pron.hidden = !open;
      reveal.textContent = open ? 'Skjul uttale' : 'Vis uttale';
      reveal.setAttribute('aria-expanded', String(open));
    });

    card.append(pic, ko, no, reveal, pron);
    grid.append(card);
  });

  function setFilter(f){
    filterEl.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.f === f)); });
    Object.keys(setEls).forEach(function(k){ setEls[k].sec.hidden = !!f && k !== f; });
    try { localStorage.setItem('set', f); } catch(e) {}
  }
  filterEl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) setFilter(b.dataset.f);
  });
  var savedSet = '';
  try { savedSet = localStorage.getItem('set') || ''; } catch(e) {}
  setFilter(setEls[savedSet] ? savedSet : '');
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
